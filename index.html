<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>甲方又改稿了</title>
<style>html,body{margin:0;height:100%;background:#E9EAEE}</style>
</head>
<body>
<script>
// 公开试玩链接的入口：每次打开都先问一下“现在最新是哪一版”（不走缓存），再加载那一版。
// 每个版本的文件名都不一样，所以浏览器/微信缓存了旧版也不会被用上。
(function () {
  var t = Date.now();
  function boot(file) {
    fetch(file, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (html) {
      document.open(); document.write(html); document.close();
    }).catch(function () { location.replace(file); });
  }
  fetch('version.json?t=' + t, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (v) { boot(v.file); })
    .catch(function () { location.replace('latest.html?t=' + t); });
})();
</script>
</body>
</html>
