<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>甲方退散</title>
<style>
/* 网页预览外壳：手机上全屏，电脑上显示成手机预览框。游戏本体全部画在 canvas 里。 */
:root{
  --font-display:"JF Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
  --font-mono:"JF Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#E6E8EC;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-body)}
.desk-bg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:#E6E8EC}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#safe{position:absolute;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.statusbar,.island,.home-ind,.preview-cap{display:none}
.capsule{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:15;display:flex;align-items:center;height:32px;width:87px;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 .5px rgba(22,24,29,.14);box-sizing:border-box;pointer-events:none}
.capsule span{flex:1;display:grid;place-items:center;height:100%}
.capsule i{width:.5px;height:18px;background:rgba(22,24,29,.18)}
.capsule svg{width:18px;height:18px}
@media (min-width:600px) and (min-height:620px){
  body{background:#C9CDD4}
  .device{height:min(852px,calc(100vh - 64px));width:auto;aspect-ratio:393/852;border-radius:48px;box-shadow:0 0 0 10px #16181D,0 0 0 11px #3A3E47,0 30px 60px rgba(22,24,29,.35)}
  #safe{padding:50px 0 30px 0}
  .statusbar{display:flex;position:absolute;top:0;left:0;right:0;z-index:15;height:50px;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;box-sizing:border-box;font-size:15px;font-weight:600;font-family:-apple-system,"SF Pro Text","PingFang SC",var(--font-body);color:#16181D;pointer-events:none}
  .statusbar .icons{display:flex;gap:6px;align-items:center}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:16;pointer-events:none}
  .home-ind{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#16181D;z-index:16;pointer-events:none}
  .capsule{top:56px}
  .preview-cap{display:block;font-family:var(--font-mono);font-size:11px;color:#5E6573;letter-spacing:.04em}
  .device.fine,.device.fine *{cursor:none!important}
}
.finger{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(22,24,29,.14);box-shadow:inset 0 0 0 1.5px rgba(22,24,29,.35);pointer-events:none;z-index:30;transition:transform .1s ease,background .1s;display:none}
.finger.down{transform:scale(.78);background:rgba(22,24,29,.26)}
/* 模拟激励视频 */
.web-ad{position:absolute;inset:0;z-index:40;background:rgba(14,15,18,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.web-ad .ad{background:#0E0F12;color:#fff;border-radius:18px;width:100%;max-width:340px;aspect-ratio:9/14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;text-align:center;padding:20px;box-sizing:border-box;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.web-ad .count{position:absolute;top:14px;right:14px;font-family:var(--font-mono);font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:12px}
.web-ad .close{position:absolute;top:14px;left:14px;font-size:12px;color:#9aa0ab;background:rgba(255,255,255,.08);border:0;border-radius:12px;padding:4px 10px;cursor:pointer}
.web-ad b{font-size:18px}
.web-ad p{margin:0;font-size:13px;color:#9aa0ab;line-height:1.6}
</style>
  
</head>

<div class="desk-bg">
